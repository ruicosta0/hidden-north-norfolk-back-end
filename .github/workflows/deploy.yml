name: Deploy Hidden North Norfolk Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew :app:bootJar

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H 159.69.218.169 > ~/.ssh/known_hosts

      - name: Deploy JAR to Server
        run: |
          JAR_NAME="app-0.0.1-SNAPSHOT.jar"
          LOCAL_JAR_PATH="app/build/libs/$JAR_NAME"
          REMOTE_SERVER="admin@159.69.218.169"
          REMOTE_JAR_DIR="/opt/hidden-north-norfolk"

          rsync -avz -e "ssh" \
            "$LOCAL_JAR_PATH" \
            "$REMOTE_SERVER:$REMOTE_JAR_DIR/$JAR_NAME"

          ssh "$REMOTE_SERVER" << EOF
            mv "$REMOTE_JAR_DIR/$JAR_NAME" \
               "$REMOTE_JAR_DIR/hidden-north-norfolk.jar"

            sudo -n systemctl restart hidden-north-norfolk.service
          EOF