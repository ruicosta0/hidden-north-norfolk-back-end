name: Deploy Hidden North Norfolk Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H 159.69.218.169 > ~/.ssh/known_hosts

      - name: Build JAR
        run: |
          ./gradlew :app:bootJar

      # Deployment will be added once the new
      # Hidden North Norfolk service is configured.