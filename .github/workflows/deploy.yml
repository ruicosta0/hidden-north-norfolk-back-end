name: Deploy Sharrington Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H 159.69.218.169 > ~/.ssh/known_hosts

      - name: Build JAR
        run: |
          ./gradlew :app:bootJar

      - name: Deploy JAR to Server
        run: |
          JAR_NAME="app-0.0.1-SNAPSHOT.jar"
          LOCAL_JAR_PATH="app/build/libs/$JAR_NAME"
          REMOTE_SERVER="admin@159.69.218.169"
          REMOTE_JAR_DIR="/opt/sharrington"

          rsync -avz -e "ssh" $LOCAL_JAR_PATH $REMOTE_SERVER:$REMOTE_JAR_DIR/$JAR_NAME

          ssh $REMOTE_SERVER << EOF
            mv $REMOTE_JAR_DIR/$JAR_NAME $REMOTE_JAR_DIR/sharrington.jar
            sudo systemctl restart sharrington.service
          EOF